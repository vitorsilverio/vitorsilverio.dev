@if (article(); as article) {
  <article class="page article">
    <div class="container article-wrap">
      <a class="back" routerLink="/artigos">← Voltar aos artigos</a>

      <img
        class="article-cover"
        [src]="'/assets/covers/' + article.slug + '.svg'"
        [alt]="article.title"
        width="1200"
        height="630"
      />

      <header class="article-header">
        <div class="tags">
          @for (tag of article.tags; track tag) {
            <a class="tag tag-link" routerLink="/artigos" [queryParams]="{ tag }">{{ tag }}</a>
          }
        </div>
        <h1>{{ article.title }}</h1>
        <p class="article-meta muted">
          <time [attr.datetime]="article.date">{{ formattedDate(article.date) }}</time>
          · {{ article.readingTime }} de leitura
        </p>
      </header>

      <div class="prose">
        <router-outlet />
      </div>

      <app-giscus-comments [term]="article.slug" />
    </div>
  </article>
} @else {
  <router-outlet />
}
