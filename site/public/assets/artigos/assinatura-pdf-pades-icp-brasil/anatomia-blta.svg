<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">Anatomia de um PDF PAdES B-LTA</title>
<desc id="d">Barra proporcional ao arquivo de 33954 bytes, dividida em cinco revisões, com a área coberta pelo ByteRange da assinatura e do carimbo de documento.</desc>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--c1:#dbe7f5;--c2:#e8e2f2;--cov:#bfe3c8;--gap:#f7d9a8;--out:#e4e4e4;--st:#555}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#eceff4;--c1:#27384f;--c2:#3a3050;--cov:#255a37;--gap:#6b4a17;--out:#34373d;--st:#aaa}}
rect.bg{fill:var(--bg)} text{fill:var(--fg);font-family:system-ui,Segoe UI,sans-serif}
.h{font-size:20px;font-weight:600} .s{font-size:15px} .t{font-size:14px}
.r0{fill:var(--c1)} .r1{fill:var(--c2)} .cov{fill:var(--cov)} .gap{fill:var(--gap)} .out{fill:var(--out)}
rect:not(.bg){stroke:var(--st);stroke-width:1} .ax{stroke:var(--st);stroke-width:1}
</style>
<rect class="bg" x="0" y="0" width="1200" height="470"/>
<text x="40" y="30" class="h">blta.pdf: 33954 bytes, 5 revisões (largura proporcional aos bytes)</text>
<text x="40" y="52" class="s">Revisões (cada %%EOF fecha uma)</text>
<rect x="40.0" y="60" width="48.7" height="44" class="r0"/>
<text x="64.4" y="87.0" text-anchor="middle" class="t">1</text>
<rect x="88.7" y="60" width="528.7" height="44" class="r1"/>
<text x="353.1" y="87.0" text-anchor="middle" class="t">2  Sig1 (assinatura + carimbo da assinatura)</text>
<rect x="617.4" y="60" width="171.4" height="44" class="r0"/>
<text x="703.1" y="87.0" text-anchor="middle" class="t">3  DSS</text>
<rect x="788.7" y="60" width="342.9" height="44" class="r1"/>
<text x="960.2" y="87.0" text-anchor="middle" class="t">4  DocTimeStamp</text>
<rect x="1131.6" y="60" width="28.4" height="44" class="r0"/>
<text x="1145.8" y="87.0" text-anchor="middle" class="t">5</text>
<text x="40" y="152" class="s">O que a assinatura Sig1 cobre: ByteRange [0, 2420, 16942, 562]</text>
<rect x="40.0" y="160" width="79.8" height="44" class="cov"/>
<text x="79.9" y="187.0" text-anchor="middle" class="t">2420 B</text>
<rect x="119.8" y="160" width="479.0" height="44" class="gap"/>
<text x="359.3" y="187.0" text-anchor="middle" class="t">/Contents: 7260 B reservados, 4840 B de CMS</text>
<rect x="598.8" y="160" width="18.5" height="44" class="cov"/>
<rect x="617.4" y="160" width="542.6" height="44" class="out"/>
<text x="888.7" y="187.0" text-anchor="middle" class="t">fora do ByteRange (revisões 3 a 5)</text>
<text x="40" y="252" class="s">O que o DocTimeStamp cobre: ByteRange [0, 23538, 32636, 458]</text>
<rect x="40.0" y="260" width="776.4" height="44" class="cov"/>
<text x="428.2" y="287.0" text-anchor="middle" class="t">23538 B: tudo, inclusive Sig1 e o DSS</text>
<rect x="816.4" y="260" width="300.1" height="44" class="gap"/>
<text x="966.5" y="287.0" text-anchor="middle" class="t">/Contents: 4548 B reservados</text>
<rect x="1116.5" y="260" width="15.1" height="44" class="cov"/>
<rect x="1131.6" y="260" width="28.4" height="44" class="out"/>
<line x1="40" y1="340" x2="1160" y2="340" class="ax"/>
<line x1="40.0" y1="340" x2="40.0" y2="346" class="ax"/>
<text x="40.0" y="362" text-anchor="middle" class="s">0</text>
<line x1="88.7" y1="340" x2="88.7" y2="346" class="ax"/>
<text x="88.7" y="380" text-anchor="middle" class="s">1477</text>
<line x1="119.8" y1="340" x2="119.8" y2="346" class="ax"/>
<text x="119.8" y="362" text-anchor="middle" class="s">2420</text>
<line x1="598.8" y1="340" x2="598.8" y2="346" class="ax"/>
<text x="598.8" y="380" text-anchor="middle" class="s">16942</text>
<line x1="617.4" y1="340" x2="617.4" y2="346" class="ax"/>
<text x="617.4" y="362" text-anchor="middle" class="s">17504</text>
<line x1="788.7" y1="340" x2="788.7" y2="346" class="ax"/>
<text x="788.7" y="380" text-anchor="middle" class="s">22699</text>
<line x1="816.4" y1="340" x2="816.4" y2="346" class="ax"/>
<text x="816.4" y="362" text-anchor="middle" class="s">23538</text>
<line x1="1116.5" y1="340" x2="1116.5" y2="346" class="ax"/>
<text x="1116.5" y="380" text-anchor="middle" class="s">32636</text>
<line x1="1131.6" y1="340" x2="1131.6" y2="346" class="ax"/>
<text x="1131.6" y="362" text-anchor="middle" class="s">33094</text>
<line x1="1160.0" y1="340" x2="1160.0" y2="346" class="ax"/>
<text x="1160.0" y="380" text-anchor="middle" class="s">33954</text>
<rect x="40" y="410" width="18" height="18" class="cov"/><text x="66" y="424" class="s">coberto pelo hash</text>
<rect x="330" y="410" width="18" height="18" class="gap"/><text x="356" y="424" class="s">lacuna: valor de /Contents</text>
<rect x="700" y="410" width="18" height="18" class="out"/><text x="726" y="424" class="s">fora do ByteRange</text>
</svg>